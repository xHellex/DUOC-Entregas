# ===== banco-servicios (backend real, independiente) =====
spring.application.name=banco-servicios
server.port=9000

# ===== Base de datos H2 propia de este servicio =====
spring.datasource.url=jdbc:h2:mem:bancoservicios;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== Logging =====
logging.level.com.bancoxyz.bancoservicios=INFO
