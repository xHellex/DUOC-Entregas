server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:cuentasdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Tolerancia a fallos (Resilience4j)
resilience4j:
  circuitbreaker:
    instances:
      cuentasCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

# Seguridad JWT
jwt:
  secret: clave-secreta-banco-xyz-para-firmar-tokens-jwt-2024
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers
