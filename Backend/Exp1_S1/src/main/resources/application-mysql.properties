# ===== Perfil MySQL: base de datos relacional persistente =====
# Requiere una instancia MySQL con la base 'bancoxyz' creada:
#   CREATE DATABASE bancoxyz CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# Ajusta host, puerto, usuario y clave segun tu entorno.
spring.datasource.url=jdbc:mysql://localhost:3306/bancoxyz?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
