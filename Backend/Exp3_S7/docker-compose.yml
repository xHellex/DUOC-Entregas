# Kafka en modo KRaft (sin Zookeeper) + Kafka-UI para evidencia visual.
# Imagen oficial apache/kafka. Pensado para desplegar en el homelab o localmente.
#
#   docker compose up -d
#
# Dos listeners, porque el broker debe ser alcanzable desde dos redes distintas:
#   - EXTERNAL (localhost:9092): para los microservicios que corren en el host.
#   - INTERNAL (kafka:29092):    para Kafka-UI y el init, que corren en otros contenedores.
# Si Kafka se despliega en el homelab y los microservicios corren en otra
# maquina, reemplazar "localhost" en KAFKA_ADVERTISED_LISTENERS (EXTERNAL) por la
# IP del servidor, y el bootstrap-servers de config-repo/*.yml.
#
# El topico "transacciones" se crea con 3 PARTICIONES al levantar el stack
# (servicio kafka-init). Las particiones son la unidad de escalabilidad: un grupo
# de consumidores puede tener hasta 3 instancias activas repartiendose el topico.
# Los mensajes usan cuentaId como key, asi los eventos de una misma cuenta van
# siempre a la misma particion y conservan su orden.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: bancoxyz-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: bancoxyz-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic transacciones
        --partitions 3 --replication-factor 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bancoxyz-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bancoxyz
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
