server:
  port: 8083

spring:
  datasource:
    url: jdbc:h2:mem:tarjetasdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      tarjetasCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

jwt:
  secret: clave-secreta-banco-xyz-para-firmar-tokens-jwt-2024
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers

# ===== Kafka (consumidor de eventos) =====
spring.kafka:
  bootstrap-servers: localhost:9092
  consumer:
    group-id: grupo-tarjetas
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.use.type.headers: false
      spring.json.trusted.packages: "com.bancoxyz.mstarjetas.event"
      spring.json.value.default.type: "com.bancoxyz.mstarjetas.event.TransaccionCreadaEvent"
