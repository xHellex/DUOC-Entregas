server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:mem:transaccionesdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      transaccionesCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

jwt:
  secret: clave-secreta-banco-xyz-para-firmar-tokens-jwt-2024
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers

# ===== Kafka (productor de eventos) =====
spring.kafka:
  bootstrap-servers: localhost:9092
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      # El contrato del evento es el JSON, no una clase Java: no se envia el header __TypeId__
      # (evita que los consumidores intenten cargar com.bancoxyz.mstransacciones.event.*).
      spring.json.add.type.headers: false
