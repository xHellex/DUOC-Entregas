# ===== Aplicacion =====
spring.application.name=migracion-batch

# ===== Perfil activo: h2 (desarrollo) o mysql (produccion) =====
# Cambia a "mysql" para persistir en MySQL, o "h2" para BD en memoria.
spring.profiles.active=h2

# ===== Seleccion del set de datos =====
# semana_1 = datos limpios (para desarrollar)
# semana_3 = 1000 filas con todas las anomalias (para demostrar manejo de errores)
app.data.path=data/semana_1

# ===== Carpeta de salida para los reportes CSV generados =====
app.output.path=salida

# ===== Spring Batch =====
# Crea automaticamente las tablas de metadatos (BATCH_JOB_*) al arrancar
spring.batch.jdbc.initialize-schema=always
# No ejecutar los jobs automaticamente: los lanza BatchRunner en orden
spring.batch.job.enabled=false

# ===== Logging =====
logging.level.com.bancoxyz.batch=INFO
logging.level.org.springframework.batch=INFO

# ===== Logging avanzado para evidenciar paralelismo y rendimiento (S2) =====
# El patron incluye el nombre del hilo [%thread] para evidenciar los 3 hilos
# de ejecucion paralela (Batch-Thread-1, 2, 3) en la consola.
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
# Nivel DEBUG en el step para trazar el procesamiento por chunks
logging.level.org.springframework.batch.core.step.item=INFO
